<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معهد الفتح في جامع عبدالله بن عباس</title>
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">

    <style>
        /* إعدادات عامة للتجاوب وحجم الشاشة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3e11b82;
            font-family: "Cairo", sans-serif;
            font-size: 18px;
            overflow-x: hidden;
        }

        /* شريط العنوان العلوي الثابت */
        .mosquetitle {
            background-color: #1e653d;
            color: #f3f028;
            border-radius: 0 0 30px 30px;
            padding: 15px;
            text-align: center;
            border-bottom: 6px #37b06c solid;
            position: sticky;
            top: 0;
            z-index: 9999;
            font-size: 18px;
        }

        /* عنوان الإعلان الرئيسي المتجاوب */
        #TT {
            color: #1e653d;
            text-align: center;
            font-size: 22px;
            width: 90%;
            max-width: 1000px;
            font-weight: bold;
            margin: 40px auto;
            padding: 20px;
            border-radius: 25px;
            border: #1e653d 5px solid;
            background-color: #fff;
            position: relative;
        }

        /* نموذج التسجيل المتجاوب */
        .form {
            background-color: #1e653d;
            width: 90%;
            max-width: 650px;
            color: #f3f028;
            padding: 30px 20px;
            border-radius: 30px;
            text-align: center;
            margin: auto;
            font-size: 20px;
            box-shadow: 3px 2px 10px 0px #37b06c;
        }

        /* تنسيق صفوف الإدخال داخل النموذج لتكون مرنة ومترابطة */
        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input[type="text"] {
            width: 100%;
            max-width: 400px;
            height: 45px;
            font-size: 20px;
            text-align: center;
            border-radius: 20px;
            border: 2px solid transparent;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border: 3px solid #f3f028;
        }

        /* تنسيق خيارات طالب جديد / قديم */
        .yyy {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .yyy div {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* زر الإرسال */
        #sss {
            background-color: #f3f028;
            color: #1e653d;
            font-size: 22px;
            padding: 12px 35px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }

        #sss:hover {
            background-color: #fff;
        }

        /* الترحيب السفلي */
        .ooo {
            width: 100%;
            max-width: 350px;
            height: 80px;
            font-size: 30px;
            text-align: center;
            margin: 30px auto;
        }
        
        .ooo p {
            color: #1e653d;
            font-weight: bold;
        }

        /* تعديلات إضافية للشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            body {
                font-size: 16px;
            }
            #TT {
                font-size: 18px;
                padding: 15px;
            }
            .form {
                padding: 20px 10px;
                font-size: 18px;
            }
        }
    </style> 
</head>

<body>

    <div class="mosquetitle">
        <h2>أهلاً بكم بدوحة القرآن</h2>
    </div>

    <div id="TT">
        <p>معهد الفتح في جامع عبدالله بن عباس يعلن عن دورة تحفيظ القرآن الشتوية لكل الأعمار</p>
    </div>

    <form>
        <div class="form">

             <div class="form-group">
                <label for="student-name">اسم الطالب الثلاثي</label>
                <input class="jjj" id="student-name" type="text" required autofocus>
             </div>

             <div class="form-group">
                <label for="student-age">العمر</label>
                <input type="text" id="student-age" required>
             </div>

             <div class="form-group">
                <label for="student-grade">الصف الدراسي</label>
                <input type="text" id="student-grade" required>
             </div>

             <div class="yyy">
                <div>
                    <input id="three" type="radio" name="os">
                    <label for="three">طالب جديد</label>
                </div>
                <div>
                    <input id="four" type="radio" name="os">
                    <label for="four">طالب موجود سابقاً</label>
                </div>
             </div>

             <div class="rrr">
                 <input id="sss" type="submit" value="إرسال التسجيل">
             </div>
        </div>
    </form>
    
    <div class="ooo">
        <p>أهلاً وسهلاً</p>
    </div>

</body>
</html>
